name: GitLabMonitor
options:
  bundleIdPrefix: com.gitlab-monitor
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.gitlab-monitor
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"

targets:
  GitLabMonitor:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GitLabMonitor
    info:
      path: GitLabMonitor/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: GitLabMonitor
        CFBundleIdentifier: com.gitlab-monitor
        NSPrincipalClass: NSApplication
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitlab-monitor
        INFOPLIST_FILE: GitLabMonitor/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"

  GitLabMonitorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GitLabMonitorTests
    dependencies:
      - target: GitLabMonitor
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitLabMonitor.app/Contents/MacOS/GitLabMonitor"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
